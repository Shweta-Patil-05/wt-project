<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkers Lobby</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=cabinet-grotesk@500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="lobby.css" />
</head>
<body>
  <div class="lobby-page">
    <div class="lobby-card">
      <div class="brand">
        <h1>Checkers Lobby</h1>
        <p>Enter a room name to join the match. The board will open only after joining a room.</p>
      </div>

      <div class="lobby-box">
        <label for="roomId">Room ID</label>
        <input type="text" id="roomId" placeholder="Enter room name like room1" />

        <button id="joinBtn" class="main-btn">Join Room</button>
      </div>

      <div id="statusMessage" class="status-message"></div>

      <div class="note">
        Use the same room ID on another browser or another system to simulate multiplayer testing.
      </div>
    </div>
  </div>

  <script src="lobby.js"></script>
</body>
</html>
