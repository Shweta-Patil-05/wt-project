<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkers Auth</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=cabinet-grotesk@500,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="brand">
        <h1>Checkers</h1>
        <p>Register first, then login to continue to the lobby.</p>
      </div>

      <div class="tabs">
        <button class="tab" id="loginTab" type="button">Login</button>
        <button class="tab active" id="registerTab" type="button">Register</button>
      </div>

      <div id="statusMessage" class="status-message"></div>

      <form id="loginForm" class="form">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="Enter email" required />

        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter password" required />

        <button type="submit" class="main-btn">Login</button>
      </form>

      <form id="registerForm" class="form active-form">
        <label for="registerUsername">Username</label>
        <input type="text" id="registerUsername" placeholder="Enter username" required />

        <label for="registerEmail">Email</label>
        <input type="email" id="registerEmail" placeholder="Enter email" required />

        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword" placeholder="Create password" required />

        <button type="submit" class="main-btn">Register</button>
      </form>

      <div class="footer-text">
        After login, you will go to the room lobby page.
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
